<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VibeWorking — Российская фриланс-биржа для подростков</title>
    <meta
      name="description"
      content="Безопасная российская фриланс-биржа для подростков 13–17 лет с согласием родителей, эскроу-сделками в рублях и защищённым чатом."
    />
    <meta property="og:title" content="VibeWorking — Российская фриланс-биржа для подростков" />
    <meta
      property="og:description"
      content="Безопасная российская фриланс-биржа для подростков 13–17 лет с согласием родителей, эскроу-сделками в рублях и защищённым чатом."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-white text-neutral-900 dark:bg-dark-canvas dark:text-neutral-100 antialiased selection:bg-brand selection:text-brand-ink">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        if (!document.querySelector('script[src="/src/main.tsx"]')) return;
        if (document.querySelector('script[src="/@vite/client"]')) return;
        var host = window.location.hostname;
        if (host === 'localhost' || host === '127.0.0.1' || host.endsWith('.run.app')) return;
        window.addEventListener('load', function () {
          setTimeout(function () {
            var root = document.getElementById('root');
            if (window.__VIBEWORKING_MOUNTED__ || (root && root.childElementCount > 0)) return;
            if (root) {
              root.innerHTML =
                '<div style="max-width:560px;margin:48px auto;padding:24px;font-family:Inter,sans-serif;line-height:1.5;border:1px solid #e5e5e5;border-radius:12px">' +
                '<h2 style="margin:0 0 8px;font-size:18px">Загружены исходники вместо собранного сайта</h2>' +
                '<p style="margin:0;color:#525252;font-size:14px">На хостинг нужно загрузить готовый архив <code>hosting-site</code> из вкладки <b>GitHub Actions</b> (или папку <code>dist/</code> после команды <code>npm run build</code>).</p>' +
                '</div>';
            }
          }, 800);
        });
      })();
    </script>
  </body>
</html>
